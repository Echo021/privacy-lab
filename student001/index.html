<style>

body{

.hero{

}

</head>

    <div class="row g-4">

        </div>

        <div class="col-md-3">
            <div class="card product-card">
                <img class="card-img-top product-img"
                     src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800">
                <div class="card-body">
                    <h5>Running Shoes</h5>
                    <p>$89</p>
                    <button class="btn btn-dark w-100">
                        Add To Cart
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card product-card">
                <img class="card-img-top product-img"
                     src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=800">
                <div class="card-body">
                    <h5>Denim Jacket</h5>
                    <p>$119</p>
                    <button class="btn btn-dark w-100">
                        Add To Cart
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card product-card">
                <img class="card-img-top product-img"
                     src="https://images.unsplash.com/photo-1503341504253-dff4815485f1?q=80&w=800">
                <div class="card-body">
                    <h5>Premium Hoodie</h5>
                    <p>$69</p>
                    <button class="btn btn-dark w-100">
                        Add To Cart
                    </button>
                </div>
            </div>
        </div>

    </div>

</div>

<button
class="btn btn-dark cookie-launcher"
data-bs-toggle="modal"
data-bs-target="#cmpModal">
<i class="bi bi-cookie"></i>
</button>

<div class="modal fade" id="cmpModal">

<div class="modal-dialog modal-lg">

<div class="modal-content">

<div class="modal-header">
    <h5 class="modal-title">
        Consent Lab
    </h5>

    <button class="btn-close"
            data-bs-dismiss="modal">
    </button>
</div>

<div class="modal-body">

    <label class="form-label">
        Cookie Banner Script
    </label>

    <textarea
        id="cmpScript"
        class="form-control"
        rows="10"
        placeholder="Paste CMP script here">
    </textarea>

    <div class="mt-3 d-flex gap-2">

        <button class="btn btn-primary"
                onclick="saveScript()">
            Save
        </button>

        <button class="btn btn-success"
                onclick="runScript()">
            Run
        </button>

    </div>

    <hr>

    <div class="status-box">

        <strong>Status</strong>

        <div id="cmpStatus" class="mt-2">
            CMP Not Loaded
        </div>

    </div>

</div>

</div>

</div>

</div>

<div id="cmpContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

const STORAGE_KEY = "student001_cmp_script";

window.onload = function(){

    const saved =
        localStorage.getItem(STORAGE_KEY);

    if(saved){

        document.getElementById(
            "cmpScript"
        ).value = saved;

    }

}

function saveScript(){

    const code =
        document.getElementById(
            "cmpScript"
        ).value;

    localStorage.setItem(
        STORAGE_KEY,
        code
    );

    alert("Script Saved");

}

function runScript(){

    const code =
        document.getElementById(
            "cmpScript"
        ).value;

    if(!code){
        alert("Please paste script first");
        return;
    }

    document.getElementById(
        "cmpStatus"
    ).innerHTML =
    "CMP Loaded ✓";

    const temp =
        document.createElement("div");

    temp.innerHTML = code;

    const scripts =
        temp.querySelectorAll("script");

    scripts.forEach(oldScript=>{

        const script =
            document.createElement("script");

        [...oldScript.attributes]
        .forEach(attr=>{
            script.setAttribute(
                attr.name,
                attr.value
            );
        });

        script.text =
            oldScript.text;

        document.body.appendChild(
            script
        );

    });

}

</script>

</body>
