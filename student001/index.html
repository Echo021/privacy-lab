</h5>

class="btn-close"

</button>

</div>

<div class="modal-body">

<label class="form-label">

<div class="mt-3 d-flex gap-2">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

const STORAGE_KEY = "student001_cmp_script";

/* 页面加载自动恢复 CMP */

document.addEventListener(
    "DOMContentLoaded",
    loadCMP
);

/* 保存 */

function saveScript(){

    const code =
        document.getElementById(
            "cmpScript"
        ).value.trim();

    if(!code){

        alert(
            "Please paste CMP script."
        );

        return;
    }

    localStorage.setItem(
        STORAGE_KEY,
        code
    );

    alert(
        "CMP Saved Successfully."
    );

    location.reload();
}

/* 删除 */

function clearCMP(){

    localStorage.removeItem(
        STORAGE_KEY
    );

    location.reload();
}

/* 自动加载 CMP */

function loadCMP(){

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if(!saved){

        document.getElementById(
            "cmpStatus"
        ).innerHTML =
        "No CMP Installed";

        return;
    }

    document.getElementById(
        "cmpScript"
    ).value = saved;

    try{

        const wrapper =
            document.createElement(
                "div"
            );

        wrapper.innerHTML = saved;

        const scripts =
            wrapper.querySelectorAll(
                "script"
            );

        scripts.forEach(oldScript=>{

            const script =
                document.createElement(
                    "script"
                );

            Array.from(
                oldScript.attributes
            ).forEach(attr=>{

                script.setAttribute(
                    attr.name,
                    attr.value
                );

            });

            script.text =
                oldScript.textContent;

            document.head.appendChild(
                script
            );

        });

        document.getElementById(
            "cmpStatus"
        ).innerHTML =
        "CMP Installed ✓";

    }
    catch(e){

        console.error(e);

        document.getElementById(
            "cmpStatus"
        ).innerHTML =
        "CMP Load Failed";
    }

}

</script>
